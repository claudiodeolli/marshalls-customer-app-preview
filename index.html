        })();

        <script>
        /* Fix: multiple sidemenu items active simultaneously (shared route) */
        (function () {
          var preferredTitle = null;

          function fixDuplicateActive() {
            var allItems = document.querySelectorAll('.main-menu .navigation > li');
            var activeItems = [];
            allItems.forEach(function (li) {
              if (li.classList.contains('active')) activeItems.push(li);
            });
            if (activeItems.length <= 1) return;

            /* Determine which item to keep active */
            var keep = null;
            if (preferredTitle) {
              for (var i = 0; i < activeItems.length; i++) {
                var t = activeItems[i].querySelector('.menu-title');
                if (t && t.textContent.trim() === preferredTitle) {
                  keep = activeItems[i];
                  break;
                }
              }
            }
            /* Fallback: keep the last one in DOM order */
            if (!keep) keep = activeItems[activeItems.length - 1];

            activeItems.forEach(function (li) {
              if (li === keep) return;
              li.classList.remove('active');
              var a = li.querySelector('a');
              if (a) {
                a.classList.remove('active');
                a.removeAttribute('aria-current');
              }
            });
          }

          /* Track the nav item the user explicitly clicked */
          document.addEventListener('click', function (e) {
            if (!e.target.closest) return;
            var li = e.target.closest('.main-menu .navigation > li');
            if (!li) return;
            var t = li.querySelector('.menu-title');
            if (t) {
              preferredTitle = t.textContent.trim();
              setTimeout(fixDuplicateActive, 150);
            }
          }, true);

          /* Watch for Vue re-rendering active classes */
          var obs = new MutationObserver(fixDuplicateActive);

          function init() {
            var app = document.getElementById('app');
            if (app) {
              obs.observe(app, { attributes: true, attributeFilter: ['class'], subtree: true });
              setTimeout(fixDuplicateActive, 600);
            }
          }

          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
          } else {
            init();
          }
        })();
        </script>
        <script>

              return h('div', { class: 'row' }, [

                { name: 'Pro',         price: 'R$ 149', desc: 'Para empresas em crescimento',          features: ['3 empresas', 'Declarações acessórias', 'Suporte prioritário', 'Certificado digital'], variant: 'light-primary', active: true  },
                { name: 'Enterprise',  price: 'R$ 349', desc: 'Para negócios de maior porte',          features: ['Ilimitado', 'Tudo do Pro', 'Gerente dedicado', 'API de integração'],      variant: 'light-success', active: false }
              ];
              return h('div', [

                  return h('div', { class: 'col-12 col-md-4 mb-1', key: p.name }, [
                    h('div', { class: 'card h-100', style: p.active ? 'border: 2px solid #0052ff;' : '' }, [
                      h('div', { class: 'card-header d-flex align-items-center justify-content-between' }, [
                        h('h4', { class: 'mb-0 font-weight-bolder' }, p.name),
                        p.active ? h('span', { class: 'badge badge-pill badge-light-primary' }, 'Plano atual') : null
                      ]),
                      h('div', { class: 'card-body' }, [
                        h('div', { class: 'text-center mb-1' }, [
                          h('h2', { class: 'font-weight-bolder text-primary' }, [
                            p.price, h('small', { class: 'text-muted font-weight-normal font-small-3' }, '/mês')
                          ]),

                        ]),
                        h('ul', { class: 'list-group list-group-flush' }, p.features.map(function (f) {
                          return h('li', { class: 'list-group-item d-flex align-items-center px-0', key: f }, [
                            mkAvatar(h, 'CheckIcon', 'light-success', 22),
                            h('span', { class: 'ml-75' }, f)

                      ]),
                      h('div', { class: 'card-footer text-center' }, [

                          p.active ? 'Plano ativo' : 'Assinar plano')
                      ])
                    ])
                  ]);
                }))
              ]);
            }
          };

          /* ── Register routes once the Vue instance is ready ── */
          function registerRoutes() {
            var appEl = document.getElementById('app');
            var vm = appEl && appEl.__vue__;
            if (!vm || !vm.$router) { setTimeout(registerRoutes, 80); return; }

            vm.$router.addRoutes([
              {
                path: '/indicadores',
                name: 'indicadores',
                component: IndicadoresPage,
                meta: { gate: { action: 'read', subject: 'taxes' }, pageTitle: 'Indicadores', breadcrumb: [{ text: 'Indicadores', active: true }] }

          setTimeout(registerRoutes, 0);
