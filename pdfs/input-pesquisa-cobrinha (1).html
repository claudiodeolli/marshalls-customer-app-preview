<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Input de pesquisa com borda animada</title>
  <style>
    /*
      Input de pesquisa do clube v2 (tela /pesquisar), isolado.
      Origem: marshalls-clube/src/app/(site)/pesquisar/layout.tsx +
      src/app/globals.css (@keyframes snake-1..4). Classes Tailwind
      traduzidas para CSS puro; comportamento idêntico:
      - em repouso: quatro "cobrinhas" (gradientes) percorrem a borda em
        ciclo de 5 s sincronizado (topo e base nos primeiros 70%, direita e
        esquerda nos 30% finais);
      - com foco: as cobrinhas somem e a caixa ganha um anel de 1px azul.
    */
    :root {
      --azul: #007bff;
      --borda: rgba(0, 123, 255, 0.2);
      --texto: #6b7280;
      --placeholder: #9ca3af;
      --fundo: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--fundo);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .pesquisa {
      width: 100%;
      max-width: 48rem;      /* max-w-3xl */
      padding: 0 1rem;       /* px-4 */
    }

    /* Caixa que recorta as cobrinhas (overflow hidden) e recebe o anel no foco */
    .pesquisa__caixa {
      position: relative;
      border-radius: 0.375rem;   /* rounded-md */
      overflow: hidden;
      transition: all 200ms;
    }

    .pesquisa__caixa.focada {
      box-shadow: 0 0 0 1px var(--azul);   /* ring-[1px] ring-[#007bff] */
    }

    /* As quatro cobrinhas */
    .cobrinha {
      position: absolute;
      pointer-events: none;
      will-change: transform;
      backface-visibility: hidden;
    }

    .cobrinha--topo {
      height: 1.5px; width: 350px; top: 0; left: -350px;
      background: linear-gradient(to right, transparent 0%, var(--azul) 50%, transparent 100%);
      animation: snake-1 5s linear infinite;
    }

    .cobrinha--direita {
      width: 2px; height: 80px; top: -80px; right: 0;
      background: linear-gradient(to bottom, transparent 0%, transparent 30%, var(--azul) 100%);
      animation: snake-2 5s linear infinite;
    }

    .cobrinha--base {
      height: 1.5px; width: 350px; bottom: 0; right: -350px;
      background: linear-gradient(to left, transparent 0%, var(--azul) 50%, transparent 100%);
      animation: snake-3 5s linear infinite;
    }

    .cobrinha--esquerda {
      width: 2px; height: 80px; bottom: -80px; left: 0;
      background: linear-gradient(to top, transparent 0%, transparent 30%, var(--azul) 100%);
      animation: snake-4 5s linear infinite;
    }

    /* Com foco, as cobrinhas somem */
    .pesquisa__caixa.focada .cobrinha { display: none; }

    /* O input (base shadcn h-8 + classes da tela) */
    .pesquisa__input {
      height: 2rem;                 /* h-8 */
      width: 100%;
      min-width: 0;
      border-radius: 0.5rem;        /* rounded-lg */
      border: 1px solid var(--borda);
      background: transparent;
      padding: 0.25rem 0.625rem 0.25rem 2.5rem;   /* py-1 px-2.5 + pl-10 */
      font: inherit;
      font-size: 0.875rem;          /* md:text-sm */
      font-weight: 500;             /* font-medium */
      color: var(--texto);
      outline: none;
      transition: color 150ms, border-color 150ms;
      -webkit-appearance: none;
      appearance: none;
    }

    .pesquisa__input::placeholder {
      color: var(--placeholder);
      font-weight: 400;
    }

    /* O anel de foco é da caixa, não do input (focus-visible:ring-0) */
    .pesquisa__input:focus-visible { outline: none; box-shadow: none; }

    /* Lupa (lucide-react Search, 18px) */
    .pesquisa__icone {
      position: absolute;
      left: 0.75rem;     /* left-3 */
      top: 0.625rem;     /* top-2.5 */
      color: var(--placeholder);
      pointer-events: none;
      display: inline-flex;
    }

    /* Ciclo sincronizado de 5 s (70/30) */
    @keyframes snake-1 {            /* topo: 0-70%, esquerda → direita */
      0%            { left: -350px; }
      70%           { left: 100%; }
      70.01%, 100%  { left: -350px; }
    }
    @keyframes snake-2 {            /* direita: 70-100%, cima → baixo */
      0%, 69.99%    { top: -80px; }
      70%           { top: -80px; }
      100%          { top: 100%; }
    }
    @keyframes snake-3 {            /* base: 0-70%, direita → esquerda */
      0%            { right: -350px; }
      70%           { right: 100%; }
      70.01%, 100%  { right: -350px; }
    }
    @keyframes snake-4 {            /* esquerda: 70-100%, baixo → cima */
      0%, 69.99%    { bottom: -80px; }
      70%           { bottom: -80px; }
      100%          { bottom: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cobrinha { animation: none; display: none; }
    }
  </style>
</head>
<body>
  <div class="pesquisa">
    <div class="pesquisa__caixa" id="caixa">
      <span class="cobrinha cobrinha--topo"></span>
      <span class="cobrinha cobrinha--direita"></span>
      <span class="cobrinha cobrinha--base"></span>
      <span class="cobrinha cobrinha--esquerda"></span>

      <input
        class="pesquisa__input"
        id="busca"
        type="search"
        placeholder="Pesquise empresas ou benefícios..."
        autocomplete="off"
      />

      <span class="pesquisa__icone" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </span>
    </div>
  </div>

  <script>
    // Único comportamento em JS: ao focar, a caixa ganha o anel e as
    // cobrinhas somem; ao sair do foco, voltam.
    const caixa = document.getElementById("caixa");
    const busca = document.getElementById("busca");
    busca.addEventListener("focus", () => caixa.classList.add("focada"));
    busca.addEventListener("blur", () => caixa.classList.remove("focada"));
  </script>
</body>
</html>
