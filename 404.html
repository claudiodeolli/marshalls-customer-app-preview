        <script>
        /* Fix: multiple sidemenu items active simultaneously (shared route) */
        (function () {
          var preferredTitle = null;

          function fixDuplicateActive() {
            var allItems = document.querySelectorAll('.main-menu .navigation > li');
            var activeItems = [];
            allItems.forEach(function (li) {
              if (li.classList.contains('active')) activeItems.push(li);
            });
            if (activeItems.length <= 1) return;

            /* Determine which item to keep active */
            var keep = null;
            if (preferredTitle) {
              for (var i = 0; i < activeItems.length; i++) {
                var t = activeItems[i].querySelector('.menu-title');
                if (t && t.textContent.trim() === preferredTitle) {
                  keep = activeItems[i];
                  break;
                }
              }
            }
            /* Fallback: keep the last one in DOM order */
            if (!keep) keep = activeItems[activeItems.length - 1];

            activeItems.forEach(function (li) {
              if (li === keep) return;
              li.classList.remove('active');
              var a = li.querySelector('a');
              if (a) {
                a.classList.remove('active');
                a.removeAttribute('aria-current');
              }
            });
          }

          /* Track the nav item the user explicitly clicked */
          document.addEventListener('click', function (e) {
            if (!e.target.closest) return;
            var li = e.target.closest('.main-menu .navigation > li');
            if (!li) return;
            var t = li.querySelector('.menu-title');
            if (t) {
              preferredTitle = t.textContent.trim();
              setTimeout(fixDuplicateActive, 150);
            }
          }, true);

          /* Watch for Vue re-rendering active classes */
          var obs = new MutationObserver(fixDuplicateActive);

          function init() {
            var app = document.getElementById('app');
            if (app) {
              obs.observe(app, { attributes: true, attributeFilter: ['class'], subtree: true });
              setTimeout(fixDuplicateActive, 600);
            }
          }

          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
          } else {
            init();
          }
        })();

              wrap.style.marginBottom = '1rem';
              /* top row: plan name left, Titular + badge right */
              var topRow = document.createElement('div');
              topRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:0.25rem;';
              var h4 = document.createElement('h4');
              h4.style.cssText = 'font-weight:600;font-size:1.1rem;color:#5e5873;margin:0;';
              h4.textContent = 'Plano de Assinatura Individual';
              var right = document.createElement('span');
              right.style.cssText = 'display:flex;align-items:center;gap:8px;';
              var titular = document.createElement('span');
              titular.style.cssText = 'color:#6e6b7b;font-size:0.9rem;';
              titular.textContent = 'Titular';
              var badge = document.createElement('span');
              badge.style.cssText = 'background:#28c76f;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;letter-spacing:0.5px;';
              badge.textContent = 'ATIVA';
              right.appendChild(titular);
              right.appendChild(badge);
              topRow.appendChild(h4);
              topRow.appendChild(right);
              var p = document.createElement('p');
              p.style.cssText = 'color:#6e6b7b;margin-bottom:1rem;';
              p.textContent = 'Titular Respons\u00e1vel: Jos\u00e9 da Silva \u2013 CPF 432.198.765-09';
              wrap.appendChild(topRow);
              wrap.appendChild(p);
              return wrap;
            }
            function syncAssinaturaInfo() {
              var vm = getVm();
              if (!vm || !vm.$route) return;
              if (vm.$route.name === 'parceiros') {
                var contentBody = document.querySelector('.app-content .content-body') || document.querySelector('.content-body');
                if (!contentBody) return;
                var target = contentBody.querySelector('.row, .card');
                if (!target) return;
                if (!document.getElementById('_assinatura-info')) {
                  target.parentNode.insertBefore(buildInfoEl(), target);
                }
                var bcActive = document.querySelector('.breadcrumb .breadcrumb-item.active');
                if (bcActive && bcActive.textContent.trim() !== 'Tipo de Assinatura Individual') {
                  bcActive.textContent = 'Tipo de Assinatura Individual';
                }
              } else {
                var el = document.getElementById('_assinatura-info');
                if (el) el.remove();
              }
            }
            var _obs = new MutationObserver(syncAssinaturaInfo);
            function init() {
              var app = document.getElementById('app');
              if (!app) { setTimeout(init, 100); return; }
              _obs.observe(app, { childList: true, subtree: true });
            }
            init();
          })();
        </script>
        <script>
          (function() {
            function injectGreeting() {
              var wrapper = document.querySelector('.header-navbar .navbar-container .bookmark-wrapper');
              if (!wrapper) return;
              var span = wrapper.querySelector('span');
              if (span && !span.textContent.trim()) {
                span.textContent = 'Ol\u00e1 Jo\u00e3o, seja bem-vindo!';
                span.className = 'navbar-greeting';
              } else if (!span) {
                var s = document.createElement('span');
                s.textContent = 'Ol\u00e1 Jo\u00e3o, seja bem-vindo!';
                s.className = 'navbar-greeting';
                wrapper.appendChild(s);
              }
            }
            var observer = new MutationObserver(function() { injectGreeting(); });
            observer.observe(document.body, { childList: true, subtree: true });
            setTimeout(injectGreeting, 1000);
          })();
        </script>
        <style>
          /* ── COLLAPSED SIDEBAR ENHANCEMENTS ─────────────────── */
          .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navigation > li > a {
            justify-content: center !important;
          }
          [dir=ltr] .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navigation > li > a svg,
          [dir=ltr] .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navigation > li > a i {
            margin-right: 0 !important;
          }
          .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navigation > li > a .menu-title {
            display: none !important;
          }
          /* Active item: primary blue gradient */
          [dir] .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navigation > li.active > a {
            background: linear-gradient(118deg, #0052ff, rgba(0,82,255,.65)) !important;
            box-shadow: 0 0 10px 1px rgba(0,82,255,.35) !important;
            border-radius: 8px !important;
            color: #fff !important;
            margin: 2px 10px !important;
            width: calc(100% - 20px) !important;
          }
          .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navigation > li.active > a svg {
            fill: rgba(255,255,255,.2) !important;
            stroke: #fff !important;
          }
          /* Hover: subtle blue tint */
          [dir] .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navigation > li:not(.active) > a:hover {
            background: rgba(0,82,255,.08) !important;
            border-radius: 8px !important;
            margin: 0 10px !important;
            width: calc(100% - 20px) !important;
            box-shadow: none !important;
          }
          /* Hamburger rotates 90deg when sidebar is collapsed */
          .header-navbar .navbar-container .navbar-nav .nav-item:first-child .nav-link svg {
            transition: transform .35s cubic-bezier(.4,0,.2,1);
          }
          .vertical-layout.vertical-menu-modern.menu-collapsed
            .header-navbar .navbar-container .navbar-nav .nav-item:first-child .nav-link svg {
            transform: rotate(90deg);
          }
          /* Logo: swap to Med menor when collapsed */
          img._logo-collapsed { display: none; }
          /* width:100% fixes from DevTools */
          .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navbar-header {
            width: 100% !important;
            display: flex !important;
            align-items: center !important;
          }
          .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navbar-header .navbar-nav {
            width: 100% !important;
            justify-content: center !important;
          }
          .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navbar-header .nav-item.mr-auto {
            margin-right: 0 !important;
            flex: none !important;
          }
          [dir] .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navbar-header .navbar-brand {
            margin: 0 !important;
            padding: 0 !important;
            justify-content: center;
          }
          /* Hide full brand-logo container when collapsed */
          .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navbar-header .brand-logo {
            display: none !important;
          }
          /* Show the small logo (sibling of brand-logo, inside navbar-brand) */
          .vertical-layout.vertical-menu-modern.menu-collapsed .main-menu:not(.expanded) .navbar-header img._logo-collapsed {
            display: block !important;
            width: 45px;
            height: auto;
            max-width: 45px;
            object-fit: contain;
          }
          /* Floating tooltip */
          #_sb-tip {
            position: fixed;
            z-index: 99999;
            background: rgba(22,33,52,.93);
            color: #fff;
            padding: 5px 13px;
            border-radius: 7px;
            font-size: .78rem;
            font-weight: 600;
            letter-spacing: .025em;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-50%);
            transition: opacity .15s ease;
            box-shadow: 0 4px 18px rgba(0,0,0,.22);
            font-family: Montserrat, Helvetica, Arial, serif;
          }
        </style>
        <script>
          (function () {
            'use strict';
            /* 1 ── Hamburger → toggleCollapsed on desktop (capture phase) ── */
            function getStore() {
              var app = document.getElementById('app');
              return app && app.__vue__ && app.__vue__.$store;
            }
            document.addEventListener('click', function (e) {
              if (window.innerWidth < 1200) return;
              var navLink = e.target && typeof e.target.closest === 'function'
                ? e.target.closest('.header-navbar .navbar-container .navbar-nav .nav-item:first-child .nav-link')
                : null;
              if (!navLink) return;
              var store = getStore();
              if (!store) return;
              e.stopImmediatePropagation();
              e.preventDefault();
              var cur = store.state.verticalMenu && store.state.verticalMenu.isVerticalMenuCollapsed;
              store.commit('verticalMenu/UPDATE_VERTICAL_MENU_COLLAPSED', !cur);
            }, true);
            /* 2 ── Floating tooltip for collapsed sidebar items ── */
            var tip = document.createElement('div');
            tip.id = '_sb-tip';
            document.body.appendChild(tip);
            function isCollapsed() {
              var layout = document.querySelector('.vertical-layout');
              if (!layout || !layout.classList.contains('menu-collapsed')) return false;
              var menu = document.querySelector('.main-menu');
              return !menu || !menu.classList.contains('expanded');
            }
            document.addEventListener('mouseover', function (e) {
              if (!isCollapsed()) { tip.style.opacity = '0'; return; }
              var li = e.target && typeof e.target.closest === 'function'
                ? e.target.closest('.main-menu .navigation > li:not(.navigation-header)')
                : null;
              if (!li) { tip.style.opacity = '0'; return; }
              var span = li.querySelector('a .menu-title');
              if (!span) return;
              var rect = li.getBoundingClientRect();
              tip.textContent = span.textContent.trim();
              tip.style.top  = (rect.top + rect.height / 2) + 'px';
              tip.style.left = (rect.right + 10) + 'px';
              tip.style.opacity = '1';
            }, false);
            /* 3 ── Logo swap for collapsed state ── */
            function injectCollapsedLogo() {
              var brandLogo = document.querySelector('.main-menu .navbar-header .navbar-brand .brand-logo');
              if (!brandLogo) { setTimeout(injectCollapsedLogo, 300); return; }
              var orig = brandLogo.querySelector('img');
              if (!orig) { setTimeout(injectCollapsedLogo, 300); return; }
              if (brandLogo.querySelector('._logo-collapsed')) return;
              orig.classList.add('_logo-full');
              var small = document.createElement('img');
              small.className = '_logo-collapsed';
              small.alt = 'Logo';
              var base = orig.src.replace(/img\/[^/?#]+$/, '');
              small.src = base + 'img/MarshallsMed%20novo2_%20Med%20menor.png';
              brandLogo.parentElement.appendChild(small);
            }
            setTimeout(injectCollapsedLogo, 800);
          })();
        </script>
